<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">ROS 2 mobile robot navigation and exploration</title>
  <desc id="desc">Gazebo sends sensor data through the bridge. The EKF and either SLAM Toolbox or AMCL supply complementary transforms. Nav2 consumes transforms, map, scan and raw odometry. The frontier explorer prechecks candidate paths before sending navigation goals.</desc>
  <!-- Modified from upstream to show the current EKF, odometry, and frontier action flows. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#466783"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #18324a; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .detail { font-size: 13px; fill: #35516b; }
      .topic { font-family: ui-monospace, monospace; font-size: 13px; fill: #234c6a; }
      .box { fill: #fff; stroke: #a2b9ce; stroke-width: 1.4; }
      .nav { fill: #edf6fb; stroke: #5c91b3; stroke-width: 1.5; }
      .flow { fill: none; stroke: #466783; stroke-width: 1.65; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="690" rx="18" fill="#f4f8fb"/>
  <text class="title" x="36" y="47">ROS 2 mobile robot navigation and exploration</text>

  <rect class="box" x="40" y="76" width="240" height="76" rx="10"/>
  <text class="heading" x="58" y="105">Gazebo Fortress</text>
  <text class="detail" x="58" y="129">Differential drive, LiDAR and IMU</text>
  <rect class="box" x="440" y="76" width="240" height="76" rx="10"/>
  <text class="heading" x="458" y="105">ros_gz_bridge</text>
  <text class="detail" x="458" y="129">Gazebo transport to ROS 2</text>
  <path class="flow" d="M280 99H440"/>
  <text class="detail" x="314" y="91">Sensor data</text>
  <path class="flow" d="M440 135H280"/>
  <text class="topic" x="324" y="127">/cmd_vel</text>

  <rect class="box" x="40" y="224" width="290" height="80" rx="10"/>
  <text class="heading" x="58" y="251">Covariance relay</text>
  <text class="topic" x="58" y="275">/wheel/odom</text>
  <text class="topic" x="58" y="293">/imu/data_cov</text>
  <path class="flow" d="M491 152V184H185V224"/>
  <text class="topic" x="205" y="176">/odom, /imu/data</text>

  <rect class="box" x="400" y="224" width="320" height="80" rx="10"/>
  <text class="heading" x="418" y="251">SLAM Toolbox or AMCL</text>
  <text class="detail" x="418" y="275">Live mapping or saved-map localization</text>
  <text class="topic" x="418" y="293">map → odom</text>
  <path class="flow" d="M560 152V224"/>
  <text class="topic" x="570" y="198">/scan</text>

  <rect class="box" x="40" y="348" width="290" height="87" rx="10"/>
  <text class="heading" x="58" y="376">Planar EKF</text>
  <text class="topic" x="58" y="399">odom → base_link</text>
  <text class="topic" x="58" y="419">/odometry/filtered</text>
  <path class="flow" d="M185 304V348"/>

  <rect class="nav" x="400" y="354" width="680" height="94" rx="10"/>
  <text class="heading" x="418" y="380">Nav2</text>
  <text class="label" x="418" y="406">Navfn global planner</text>
  <text class="label" x="632" y="406">DWB local controller</text>
  <text class="label" x="848" y="406">Behavior tree</text>
  <text class="detail" x="418" y="429">LiDAR costmaps</text>
  <text class="detail" x="632" y="429">FollowPath</text>
  <text class="detail" x="848" y="429">Replanning and recovery</text>

  <path class="flow" d="M330 391H400"/>
  <text class="topic" x="350" y="381">TF</text>
  <path class="flow" d="M560 304V354"/>
  <text class="topic" x="570" y="334">TF, /map¹</text>
  <path class="flow" d="M680 103H852V354"/>
  <text class="topic" x="864" y="192">/scan → costmaps</text>
  <text class="topic" x="864" y="217">/odom → BT, controller</text>
  <path class="flow" d="M1080 388H1098V134H680"/>
  <text class="topic" x="887" y="125">/cmd_vel → bridge</text>
  <text class="detail" x="400" y="471">¹ Live map from SLAM Toolbox, saved map from Nav2 map server.</text>

  <rect x="22" y="505" width="1076" height="155" rx="13" fill="#e6eff6"/>
  <text class="heading" x="40" y="533">Frontier exploration</text>
  <rect class="box" x="40" y="553" width="178" height="64" rx="8"/>
  <text class="label" x="54" y="579">OccupancyGrid</text>
  <text class="topic" x="54" y="600">/map</text>
  <rect class="box" x="258" y="553" width="200" height="64" rx="8"/>
  <text class="label" x="272" y="579">Frontier selection</text>
  <text class="detail" x="272" y="600">8 neighbors and cooldown</text>
  <rect class="box" x="498" y="553" width="199" height="64" rx="8"/>
  <text class="topic" x="510" y="579">ComputePathToPose</text>
  <text class="detail" x="510" y="600">Path and endpoint checks</text>
  <rect class="box" x="737" y="553" width="167" height="64" rx="8"/>
  <text class="topic" x="750" y="579">NavigateToPose</text>
  <text class="detail" x="750" y="600">One goal at a time</text>
  <rect class="box" x="944" y="553" width="136" height="64" rx="8"/>
  <text class="label" x="957" y="579">Action result</text>
  <text class="detail" x="957" y="600">Update cooldown</text>
  <path class="flow" d="M218 584H258"/>
  <path class="flow" d="M458 584H498"/>
  <path class="flow" d="M697 584H737"/>
  <path class="flow" d="M904 584H944"/>
  <path class="flow" d="M1012 617V640H358V617"/>
</svg>
